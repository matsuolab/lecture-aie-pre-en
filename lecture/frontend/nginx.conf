server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: Fall back to index.html if no static file exists
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend
    # The browser can always send requests to the origin serving it,
    # so the frontend does not need a hard-coded backend hostname or port
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
