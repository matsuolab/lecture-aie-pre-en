server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 静的ファイルが無ければindex.htmlにフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # backendへのリバースプロキシ
    # ブラウザからは常に自分がアクセスしているオリジンにリクエストすればよく、
    # backendのホスト名/ポートをフロント側にハードコードしなくて済む
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
