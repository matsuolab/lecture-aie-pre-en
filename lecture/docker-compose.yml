services:
  backend:
    build: ./backend
    # Do not publish the port to the host.
    # The frontend nginx reverse-proxies to backend:8000 within the same
    # Docker network, so direct access from outside is unnecessary.
    # (Publishing it would also show port 8000 in the Codespace port list and cause confusion.)
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
